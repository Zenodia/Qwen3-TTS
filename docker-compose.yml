services:
  qwen3-tts-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: qwen3-tts:0.6b-customvoice
    container_name: qwen3-tts-demo
    ports:
      - "8000:8000"
    volumes:
      # Mount a local directory for outputs
      - ./outputs:/workspace/outputs
      # Optional: Mount examples directory for testing
      - ./examples:/workspace/Qwen3-TTS/examples:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      - HF_HOME=/workspace/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8000"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 60s

  # Alternative service for interactive development
  qwen3-tts-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: qwen3-tts:0.6b-customvoice
    container_name: qwen3-tts-dev
    ports:
      - "8001:8000"
    volumes:
      - ./outputs:/workspace/outputs
      - .:/workspace/Qwen3-TTS
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: /bin/bash
    stdin_open: true
    tty: true
    profiles:
      - dev

